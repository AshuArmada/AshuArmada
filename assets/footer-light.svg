<svg xmlns="http://www.w3.org/2000/svg" width="900" height="96" viewBox="0 0 900 96" role="img" aria-label=""><title></title><style>@keyframes roll{from{transform:translateX(0)}to{transform:translateX(-300px)}}@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}@keyframes ping{0%{transform:scale(1);opacity:.8}80%,100%{transform:scale(3);opacity:0}}.w1{animation:roll 9s linear infinite}.w2{animation:roll 14s linear infinite reverse}.w3{animation:roll 20s linear infinite}.bob{animation:bob 5s ease-in-out infinite}.rng{transform-origin:450px 22px;animation:ping 2.6s ease-out infinite}@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style><defs><linearGradient id="g1" x1="0" x2="1"><stop offset="0" stop-color="#0e7490"/><stop offset=".5" stop-color="#6d28d9"/><stop offset="1" stop-color="#be185d"/></linearGradient><linearGradient id="g2" x1="1" x2="0"><stop offset="0" stop-color="#0369a1"/><stop offset="1" stop-color="#6d28d9"/></linearGradient><clipPath id="clip"><rect width="900" height="96"/></clipPath></defs><g clip-path="url(#clip)"><g class="bob"><circle class="rng" cx="450" cy="22" r="4.5" fill="none" stroke="#6d28d9" stroke-width="1.8"/><circle cx="450" cy="22" r="4.5" fill="url(#g1)"/></g><g transform="translate(-300,0)"><path class="w3" d="M0 54q75 -20 150 0t150 0t150 0t150 0t150 0t150 0t150 0t150 0t150 0t150 0t150 0V96H0Z" fill="url(#g2)" fill-opacity=".16"/></g><g transform="translate(-300,0)"><path class="w2" d="M0 62q75 -24 150 0t150 0t150 0t150 0t150 0t150 0t150 0t150 0t150 0t150 0t150 0V96H0Z" fill="url(#g1)" fill-opacity=".22"/></g><g transform="translate(-300,0)"><path class="w1" d="M0 70q75 -18 150 0t150 0t150 0t150 0t150 0t150 0t150 0t150 0t150 0t150 0t150 0V96H0Z" fill="url(#g1)" fill-opacity=".38"/></g></g></svg>
