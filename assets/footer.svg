<svg xmlns="http://www.w3.org/2000/svg" width="900" height="140" viewBox="0 0 900 140" role="img" aria-label="Footer"><title>Footer</title><style>@keyframes roll{from{transform:translateX(0)}to{transform:translateX(-300px)}}@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}@keyframes ping{0%{transform:scale(1);opacity:.8}80%,100%{transform:scale(3.2);opacity:0}}.w1{animation:roll 9s linear infinite}.w2{animation:roll 14s linear infinite reverse}.w3{animation:roll 20s linear infinite}.bob{animation:bob 5s ease-in-out infinite}.rng{transform-origin:450px 44px;animation:ping 2.6s ease-out infinite}@keyframes edge{to{stroke-dashoffset:-100}}@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style><defs><linearGradient id="g1" x1="0" x2="1"><stop offset="0" stop-color="#22d3ee"/><stop offset=".5" stop-color="#a78bfa"/><stop offset="1" stop-color="#f472b6"/></linearGradient><linearGradient id="g2" x1="1" x2="0"><stop offset="0" stop-color="#7dd3fc"/><stop offset="1" stop-color="#a78bfa"/></linearGradient><clipPath id="clip"><rect width="900" height="140"/></clipPath></defs><g clip-path="url(#clip)"><g class="bob"><circle class="rng" cx="450" cy="44" r="5" fill="none" stroke="#a78bfa" stroke-width="2"/><circle cx="450" cy="44" r="5" fill="url(#g1)"/></g><g transform="translate(-300,0)"><path class="w3" d="M0 96q75 -22 150 0t150 0t150 0t150 0t150 0t150 0t150 0t150 0t150 0t150 0t150 0V140H0Z" fill="url(#g2)" fill-opacity=".14"/></g><g transform="translate(-300,0)"><path class="w2" d="M0 104q75 -26 150 0t150 0t150 0t150 0t150 0t150 0t150 0t150 0t150 0t150 0t150 0V140H0Z" fill="url(#g1)" fill-opacity=".2"/></g><g transform="translate(-300,0)"><path class="w1" d="M0 112q75 -20 150 0t150 0t150 0t150 0t150 0t150 0t150 0t150 0t150 0t150 0t150 0V140H0Z" fill="url(#g1)" fill-opacity=".35"/></g></g></svg>
