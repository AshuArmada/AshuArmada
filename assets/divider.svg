<svg xmlns="http://www.w3.org/2000/svg" width="900" height="20" viewBox="0 0 900 20" role="img" aria-label="Divider">
<title>Divider</title>
<style>
  @keyframes sweep {0%{transform:translateX(-300px)} 100%{transform:translateX(900px)}}
  @keyframes pulse {0%,100%{opacity:.35;transform:scale(.8)} 50%{opacity:1;transform:scale(1.25)}}
  .beam {animation:sweep 6s cubic-bezier(.6,0,.4,1) infinite}
  .dot  {transform-origin:450px 10px;animation:pulse 3s ease-in-out infinite}
  @media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
<defs>
  <linearGradient id="rail" x1="0" x2="1">
    <stop offset="0" stop-color="#8ab4ff" stop-opacity="0"/>
    <stop offset=".2" stop-color="#8ab4ff" stop-opacity=".3"/>
    <stop offset=".8" stop-color="#8ab4ff" stop-opacity=".3"/>
    <stop offset="1" stop-color="#8ab4ff" stop-opacity="0"/>
  </linearGradient>
  <linearGradient id="glow" x1="0" x2="1">
    <stop offset="0" stop-color="#22d3ee" stop-opacity="0"/>
    <stop offset=".5" stop-color="#a78bfa"/>
    <stop offset="1" stop-color="#f472b6" stop-opacity="0"/>
  </linearGradient>
  <clipPath id="strip"><rect width="900" height="20"/></clipPath>
</defs>
<rect y="9" width="900" height="1.6" rx="1" fill="url(#rail)"/>
<g clip-path="url(#strip)">
  <rect class="beam" y="8" width="300" height="3.5" rx="2" fill="url(#glow)"/>
</g>
<circle class="dot" cx="450" cy="10" r="3" fill="#a78bfa"/>
</svg>
