<svg xmlns="http://www.w3.org/2000/svg" width="900" height="250" viewBox="0 0 900 250" role="img" aria-label="Animated git commit graph: a feature branch is created, receives three commits, and is merged back into main">
<title>Animated commit graph</title>
<style>
  @keyframes draw {0%{stroke-dashoffset:100} 6%,100%{stroke-dashoffset:0}}
  @keyframes pop  {0%{transform:scale(0);opacity:0} 4%{transform:scale(1.35);opacity:1} 7%,100%{transform:scale(1);opacity:1}}
  @keyframes ping {0%{transform:scale(.5);opacity:.85} 9%{transform:scale(2.9);opacity:0} 9.01%,100%{opacity:0}}
  @keyframes fade {0%{opacity:0} 5%,100%{opacity:1}}
  @keyframes flow {0%,100%{opacity:0} 10%,90%{opacity:.9}}
  .seg  {stroke-dasharray:100;stroke-dashoffset:100;fill:none;stroke-width:3;stroke-linecap:round;
         animation:draw 12s ease-out infinite}
  .n    {opacity:0;transform-origin:0 0;animation:pop 12s cubic-bezier(.2,1.5,.4,1) infinite}
  .ping {opacity:0;transform-origin:0 0;animation:ping 12s ease-out infinite}
  .lbl  {opacity:0;animation:fade 12s ease-out infinite;
         font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:13px}
  @media (prefers-reduced-motion:reduce){*{animation:none!important;opacity:1!important;stroke-dashoffset:0!important}}
</style>
<defs>
  <clipPath id="card"><rect width="900" height="250" rx="18"/></clipPath>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#0d1224"/><stop offset=".55" stop-color="#0b1020"/>
    <stop offset="1" stop-color="#141a30"/>
  </linearGradient>
  <pattern id="grid" width="34" height="34" patternUnits="userSpaceOnUse">
    <path d="M34 0H0v34" fill="none" stroke="#8ab4ff" stroke-opacity=".055"/>
  </pattern>
</defs>

<g clip-path="url(#card)">
  <rect width="900" height="250" fill="url(#bg)"/>
  <rect width="900" height="250" fill="url(#grid)"/>

  <text x="28" y="36" class="lbl" fill="#8b949e" style="animation-delay:0s">git log --graph --oneline</text>

  <!-- lanes -->
  <path class="seg" fill="none" d="M46 180H250"  pathLength="100" stroke="#58a6ff" style="animation-delay:.05s"/>
  <path class="seg" fill="none" d="M250 180H690" pathLength="100" stroke="#58a6ff" stroke-opacity=".45" style="animation-delay:1.7s"/>
  <path class="seg" fill="none" d="M690 180H858" pathLength="100" stroke="#58a6ff" style="animation-delay:5.5s"/>
  <path class="seg" fill="none" d="M250 180C300 180 306 110 360 110" pathLength="100" stroke="#a78bfa" style="animation-delay:1.8s"/>
  <path class="seg" fill="none" d="M360 110H600" pathLength="100" stroke="#a78bfa" style="animation-delay:2.3s"/>
  <path class="seg" fill="none" d="M600 110C652 110 660 180 690 180" pathLength="100" stroke="#f472b6" style="animation-delay:4.6s"/>

  <!-- packet travelling down main -->
  <circle r="3" fill="#58a6ff" style="animation:flow 4.5s linear infinite">
    <animateMotion dur="4.5s" repeatCount="indefinite" path="M46 180H858"/>
  </circle>

  <!-- branch labels -->
  <text x="46" y="160" class="lbl" fill="#58a6ff" style="animation-delay:.15s">main</text>
  <text x="360" y="88" class="lbl" fill="#a78bfa" style="animation-delay:2.4s">feat/animated-commit-tree</text>
  <text x="706" y="154" class="lbl" fill="#f472b6" style="animation-delay:5.4s">merge --no-ff</text>

  <!-- commits: main -->
  <g transform="translate(90,180)">
    <g class="ping" style="animation-delay:.3s"><circle r="9" fill="none" stroke="#58a6ff" stroke-width="2"/></g>
    <g class="n" style="animation-delay:.3s"><circle r="9" fill="#0b1020" stroke="#58a6ff" stroke-width="3"/></g>
  </g>
  <g transform="translate(170,180)">
    <g class="ping" style="animation-delay:.85s"><circle r="9" fill="none" stroke="#58a6ff" stroke-width="2"/></g>
    <g class="n" style="animation-delay:.85s"><circle r="9" fill="#0b1020" stroke="#58a6ff" stroke-width="3"/></g>
  </g>
  <g transform="translate(250,180)">
    <g class="ping" style="animation-delay:1.4s"><circle r="9" fill="none" stroke="#58a6ff" stroke-width="2"/></g>
    <g class="n" style="animation-delay:1.4s"><circle r="9" fill="#0b1020" stroke="#58a6ff" stroke-width="3"/></g>
  </g>

  <!-- commits: feature -->
  <g transform="translate(400,110)">
    <g class="ping" style="animation-delay:2.9s"><circle r="9" fill="none" stroke="#a78bfa" stroke-width="2"/></g>
    <g class="n" style="animation-delay:2.9s"><circle r="9" fill="#0b1020" stroke="#a78bfa" stroke-width="3"/></g>
  </g>
  <g transform="translate(480,110)">
    <g class="ping" style="animation-delay:3.5s"><circle r="9" fill="none" stroke="#a78bfa" stroke-width="2"/></g>
    <g class="n" style="animation-delay:3.5s"><circle r="9" fill="#0b1020" stroke="#a78bfa" stroke-width="3"/></g>
  </g>
  <g transform="translate(560,110)">
    <g class="ping" style="animation-delay:4.1s"><circle r="9" fill="none" stroke="#a78bfa" stroke-width="2"/></g>
    <g class="n" style="animation-delay:4.1s"><circle r="9" fill="#0b1020" stroke="#a78bfa" stroke-width="3"/></g>
  </g>

  <!-- merge + tip -->
  <g transform="translate(690,180)">
    <g class="ping" style="animation-delay:5.2s"><circle r="12" fill="none" stroke="#f472b6" stroke-width="2"/></g>
    <g class="n" style="animation-delay:5.2s">
      <circle r="12" fill="#0b1020" stroke="#f472b6" stroke-width="3"/>
      <circle r="4" fill="#f472b6"/>
    </g>
  </g>
  <g transform="translate(780,180)">
    <g class="ping" style="animation-delay:6s"><circle r="9" fill="none" stroke="#58a6ff" stroke-width="2"/></g>
    <g class="n" style="animation-delay:6s"><circle r="9" fill="#0b1020" stroke="#58a6ff" stroke-width="3"/></g>
  </g>

  <!-- HEAD marker walking the graph -->
  <g opacity="0" transform="translate(250,180)">
    <animateTransform attributeName="transform" type="translate" dur="12s" repeatCount="indefinite"
      keyTimes="0;0.13;0.24;0.25;0.29;0.30;0.34;0.35;0.43;0.442;0.50;0.508;1"
      values="250 180;250 180;250 180;400 110;400 110;480 110;480 110;560 110;560 110;690 180;690 180;780 180;780 180"/>
    <animate attributeName="opacity" dur="12s" repeatCount="indefinite"
      keyTimes="0;0.12;0.14;0.96;1" values="0;0;1;1;0"/>
    <path d="M0 12v10" stroke="#e6edf3" stroke-width="1.5" stroke-opacity=".5"/>
    <rect x="-29" y="22" width="58" height="22" rx="7" fill="#e6edf3" fill-opacity=".1" stroke="#e6edf3" stroke-opacity=".45"/>
    <text x="0" y="37" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" fill="#e6edf3">HEAD</text>
  </g>
</g>
<rect x=".75" y=".75" width="898.5" height="248.5" rx="18" fill="none" stroke="#8ab4ff" stroke-opacity=".18"/>
</svg>
