<svg xmlns="http://www.w3.org/2000/svg" width="275" height="36" viewBox="0 0 275 36" role="img" aria-label="LinkedIn"><title>LinkedIn</title><style>@keyframes hum{0%,100%{opacity:.55;transform:scale(.9)}50%{opacity:1;transform:scale(1.15)}}@keyframes slide{0%,55%{transform:translateX(-70px)}85%,100%{transform:translateX(345px)}}.dot{transform-origin:24px 18px;animation:hum 3.2s ease-in-out infinite}.sheen{animation:slide 7s cubic-bezier(.16,1,.3,1) infinite}@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style><defs><clipPath id="pill"><rect x="1" y="1" width="273.4" height="34" rx="17"/></clipPath><linearGradient id="sh" x1="0" x2="1"><stop offset="0" stop-color="#a78bfa" stop-opacity="0"/><stop offset=".5" stop-color="#a78bfa" stop-opacity=".22"/><stop offset="1" stop-color="#a78bfa" stop-opacity="0"/></linearGradient></defs><rect x="1" y="1" width="273.4" height="34" rx="17" fill="#a78bfa" fill-opacity=".07" stroke="#a78bfa" stroke-opacity=".55"/><g clip-path="url(#pill)"><rect class="sheen" y="1" width="70" height="34" fill="url(#sh)"/></g><circle class="dot" cx="24" cy="18" r="4" fill="#a78bfa"/><text x="38" y="23" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="500" fill="#e6edf3">linkedin.com/in/ashutosh-thakur</text></svg>
